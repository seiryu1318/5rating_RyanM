<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="9등급·5등급 양방향 환산 및 대학 라인 참고 도구">
  <title>라이언의 5등급제 환산 테이블 모바일 ver.08</title>
  <style>:root {
  --bg: #090414;
  --bg-soft: #110821;
  --panel: rgba(24, 13, 45, 0.82);
  --panel-strong: #1a0e30;
  --line: rgba(221, 197, 255, 0.13);
  --line-strong: rgba(221, 197, 255, 0.24);
  --text: #fbf9ff;
  --muted: #aca0c1;
  --purple: #a96cff;
  --purple-bright: #c49aff;
  --pink: #ff83cf;
  --cyan: #77d6ff;
  --display: "Arial Black", "Pretendard", "Noto Sans KR", sans-serif;
  --body: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; }
button { color: inherit; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid rgba(196, 154, 255, .75); outline-offset: 3px; }

main {
  min-height: 100vh;
  position: relative;
  overflow: hidden;
  background:
    linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px),
    radial-gradient(circle at 50% -10%, rgba(121, 51, 217, .28), transparent 39%),
    var(--bg);
  background-size: 54px 54px, 54px 54px, auto, auto;
}

.aurora { position: absolute; border-radius: 50%; filter: blur(85px); pointer-events: none; opacity: .34; }
.aurora-one { width: 540px; height: 540px; top: 370px; left: -300px; background: #7022d7; }
.aurora-two { width: 430px; height: 430px; top: 840px; right: -260px; background: #cc3ca3; opacity: .22; }
.site-shell { width: min(1180px, calc(100% - 40px)); margin: 0 auto; position: relative; z-index: 1; }

.site-header { min-height: 94px; display: flex; align-items: center; border-bottom: 1px solid var(--line); }
.ryan-brand { display: inline-flex; align-items: center; gap: 14px; color: var(--text); text-decoration: none; }
.ryan-brand img { width: 56px; height: 56px; object-fit: cover; border: 2px solid rgba(255,190,79,.8); border-radius: 18px; background: #fff; box-shadow: 0 9px 30px rgba(255,169,35,.17), 0 0 0 4px rgba(255,255,255,.03); }
.ryan-brand-copy { display: flex; align-items: center; gap: 10px; min-width: 0; }
.ryan-brand-copy b { font-size: 17px; letter-spacing: -.025em; white-space: nowrap; }
.ryan-brand-copy em { padding: 5px 8px; border: 1px solid rgba(196,154,255,.26); border-radius: 999px; color: var(--purple-bright); background: rgba(158,91,237,.08); font-size: 9px; font-style: normal; font-weight: 900; letter-spacing: .05em; }

.hero { text-align: center; padding: 66px 16px 54px; }
.hero h1 { margin: 0; font-family: var(--display); font-size: clamp(44px, 6.25vw, 80px); font-weight: 900; line-height: 1.08; letter-spacing: -.065em; }
.hero h1 span { color: transparent; background: linear-gradient(90deg, #d5aaff, #9b70ff 48%, #ff92d4); -webkit-background-clip: text; background-clip: text; text-shadow: 0 18px 80px rgba(157,96,255,.28); }
.hero > p { max-width: 590px; margin: 22px auto 0; color: #a99db9; font-size: 15px; line-height: 1.75; word-break: keep-all; }

.tabs { display: grid; grid-template-columns: repeat(3, 1fr); padding: 6px; border: 1px solid var(--line); border-radius: 18px 18px 0 0; background: rgba(14, 7, 27, .72); backdrop-filter: blur(18px); }
.tabs button { min-height: 64px; border: 0; border-radius: 13px; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; transition: .22s ease; }
.tabs button small { color: #655a75; font-size: 9px; font-weight: 800; letter-spacing: .16em; }.tabs button span { color: #8f839e; font-size: 14px; font-weight: 800; }
.tabs button:hover { background: rgba(255,255,255,.035); }.tabs button.active { background: linear-gradient(135deg, rgba(145,79,236,.25), rgba(102,53,169,.14)); box-shadow: inset 0 0 0 1px rgba(192,139,255,.18), 0 8px 25px rgba(0,0,0,.2); }
.tabs button.active small { color: #b78ae7; }.tabs button.active span { color: #fff; }
.tab-surface { border: 1px solid var(--line); border-top: 0; border-radius: 0 0 24px 24px; background: linear-gradient(180deg, rgba(19,10,34,.74), rgba(11,6,21,.86)); box-shadow: 0 30px 100px rgba(0,0,0,.3); }

.input-stage { display: grid; grid-template-columns: .82fr 1.18fr; gap: 58px; align-items: center; padding: 44px 52px; border-bottom: 1px solid var(--line); }
.input-copy { display: flex; align-items: flex-start; gap: 18px; }
.section-index { display: grid; place-items: center; flex: 0 0 38px; height: 38px; margin-top: 4px; border-radius: 11px; background: #8d4be7; color: white; font: 900 12px/1 var(--body); box-shadow: 0 8px 24px rgba(141,75,231,.36); }
.section-eyebrow { margin: 0 0 8px; color: #9c70d0 !important; font: 800 9px/1 var(--body) !important; letter-spacing: .2em; text-transform: uppercase; }
.input-copy h2, .result-heading h2, .guide-hero h2, .table-toolbar h2 { margin: 0; font-family: var(--display); font-size: 25px; letter-spacing: -.035em; }
.input-controls { min-width: 0; }
.scale-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; padding: 5px; border-radius: 14px; background: rgba(7,3,14,.64); border: 1px solid var(--line); }
.scale-switch button { min-height: 50px; border: 0; border-radius: 10px; background: transparent; color: #887c99; font-size: 13px; font-weight: 800; cursor: pointer; transition: .2s ease; }
.scale-switch button span { display: inline-grid; place-items: center; width: 25px; height: 25px; margin-right: 6px; border: 1px solid rgba(255,255,255,.1); border-radius: 8px; }
.scale-switch button.active { color: #fff; background: linear-gradient(135deg, #8e4be4, #6d36ad); box-shadow: 0 9px 22px rgba(92,43,155,.34); }.scale-switch button.active span { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.18); }
.grade-input { display: block; margin-top: 16px; padding: 14px 18px 12px; border: 1px solid rgba(181,123,255,.34); border-radius: 14px; background: rgba(117,61,181,.09); transition: .2s ease; }
.grade-input:focus-within { border-color: #b279ff; box-shadow: 0 0 0 4px rgba(161,89,255,.1), inset 0 0 25px rgba(157,89,244,.05); }.grade-input--error { border-color: #ff719f; }
.grade-input > span:first-child { display: block; color: #a391b8; font-size: 10px; font-weight: 800; letter-spacing: .08em; }
.grade-input-row { display: flex; align-items: baseline; }
.grade-input-row input { width: 100%; min-width: 0; padding: 4px 0 0; border: 0; outline: 0; color: #fff; background: transparent; font: 800 34px/1.2 var(--body); letter-spacing: -.03em; font-variant-numeric: tabular-nums; appearance: textfield; -moz-appearance: textfield; }
.grade-input-row input::-webkit-inner-spin-button, .grade-input-row input::-webkit-outer-spin-button { margin: 0; -webkit-appearance: none; appearance: none; }.grade-input-row b { flex: 0 0 auto; color: #cab9de; font-size: 13px; }
.input-help { margin: 7px 3px 13px; color: #71667f; font-size: 10px; }.input-help--error { color: #ff86ac; }
.grade-slider { width: 100%; height: 5px; margin: 0; accent-color: #ac6dff; cursor: pointer; }
.quick-values { display: flex; gap: 7px; margin-top: 12px; overflow-x: auto; padding-bottom: 2px; }
.quick-values button { min-width: 48px; height: 30px; border: 1px solid var(--line); border-radius: 8px; color: #9789a8; background: rgba(255,255,255,.025); cursor: pointer; font-size: 10px; font-weight: 800; }.quick-values button:hover { color: #fff; border-color: #8d58ca; background: rgba(143,76,226,.12); }

.average-strip { display: grid; grid-template-columns: 48px 1fr 1px 1.45fr; gap: 18px; align-items: center; margin: 34px 40px; padding: 20px 24px; border: 1px solid rgba(192,137,255,.25); border-radius: 16px; background: linear-gradient(100deg, rgba(130,62,214,.2), rgba(63,27,101,.13) 55%, rgba(204,74,167,.1)); box-shadow: inset 0 1px rgba(255,255,255,.05); }
.average-icon { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 14px; color: #fff; background: linear-gradient(145deg, #b56aff, #8246d7); box-shadow: 0 8px 28px rgba(155,75,232,.35); }
.average-copy, .average-verdict { display: grid; gap: 4px; }.average-copy span, .average-verdict span { color: #9b8aaa; font-size: 10px; }.average-copy strong { font-size: 21px; font-variant-numeric: tabular-nums; }.average-verdict b { font-size: 13px; }.average-divider { width: 1px; height: 34px; background: var(--line-strong); }
.result-heading { margin: 0 40px 22px; }
.cards-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; padding: 0 40px 42px; }
.source-card { --accent: #b887ff; position: relative; min-width: 0; overflow: hidden; padding: 22px; border: 1px solid var(--line); border-radius: 18px; background: linear-gradient(145deg, rgba(30,17,52,.88), rgba(17,9,30,.9)); box-shadow: 0 14px 40px rgba(0,0,0,.16); transition: transform .2s ease, border-color .2s ease; content-visibility: auto; contain-intrinsic-size: 360px; }
.source-card:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 38%, transparent); }.source-card--average { border-color: rgba(197,145,255,.34); background: linear-gradient(145deg, rgba(87,39,139,.42), rgba(28,12,48,.96)); box-shadow: 0 15px 50px rgba(116,55,178,.15); }
.card-glow { position: absolute; width: 170px; height: 170px; border-radius: 50%; top: -115px; right: -80px; background: var(--accent); filter: blur(45px); opacity: .15; pointer-events: none; }
.card-header { display: grid; grid-template-columns: 40px 1fr; gap: 11px; align-items: center; position: relative; }
.source-mark { display: grid; place-items: center; width: 40px; height: 40px; border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); border-radius: 12px; color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); font-size: 14px; font-weight: 900; }
.source-heading { min-width: 0; }.source-heading h3 { margin: 0; font-size: 13px; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conversion-readout { display: grid; grid-template-columns: 1fr 30px 1.15fr; align-items: end; margin: 26px 0 20px; }
.conversion-readout > div { display: grid; gap: 5px; }.readout-label { color: #786c87; font-size: 9px; font-weight: 700; }.input-grade { color: #b0a4bd; font-size: 19px; font-variant-numeric: tabular-nums; }.conversion-arrow { align-self: center; color: #634a7b; font-size: 18px; }.output-block { padding-left: 13px; border-left: 1px solid var(--line); }.output-grade { color: var(--accent); font-size: 29px; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 0 22px color-mix(in srgb, var(--accent) 24%, transparent); }
.scale-meter { padding: 13px 14px 11px; border: 1px solid rgba(255,255,255,.055); border-radius: 11px; background: rgba(5,2,10,.26); }.meter-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; color: #756a82; font-size: 8px; }.meter-meta b { color: #aea0bd; font-size: 9px; font-variant-numeric: tabular-nums; }.meter-track { height: 4px; position: relative; border-radius: 999px; background: rgba(255,255,255,.07); }.meter-fill { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 45%, #fff)); }.meter-dot { position: absolute; top: 50%; width: 9px; height: 9px; border: 2px solid #1a0e30; border-radius: 50%; background: var(--accent); transform: translate(-50%, -50%); box-shadow: 0 0 12px var(--accent); }.meter-ticks { display: flex; justify-content: space-between; margin-top: 6px; color: #4e4658; font-size: 7px; font-variant-numeric: tabular-nums; }
.recommendation { margin-top: 14px; min-height: 77px; padding: 14px 15px; border-left: 2px solid var(--accent); border-radius: 2px 10px 10px 2px; background: color-mix(in srgb, var(--accent) 7%, transparent); }.recommendation-kicker { color: var(--accent); font-size: 8px; font-weight: 900; letter-spacing: .08em; }.recommendation p { margin: 7px 0 0; color: #f2ecf8; font-size: 12px; font-weight: 800; line-height: 1.45; word-break: keep-all; }
.invalid-state { display: flex; align-items: center; justify-content: center; gap: 14px; min-height: 290px; margin: 30px 40px 42px; border: 1px dashed rgba(255,118,164,.28); border-radius: 18px; color: #ccbcd6; background: rgba(109,35,70,.06); }.invalid-state > span { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: rgba(255,102,154,.12); color: #ff82ad; font-weight: 900; }.invalid-state b { font-size: 14px; }.invalid-state p { margin: 5px 0 0; color: #7d6e87; font-size: 11px; }

.guide-panel, .table-panel { padding: 46px 42px 42px; }
.guide-hero, .table-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 30px; }
.guide-summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 28px; }
.guide-summary-card { min-height: 166px; padding: 22px; border: 1px solid var(--line); border-radius: 16px; background: rgba(255,255,255,.022); }
.guide-summary-card--accent { border-color: rgba(181,120,255,.24); background: linear-gradient(145deg, rgba(111,50,178,.2), rgba(37,17,61,.24)); }
.guide-summary-card > span { color: #aa72ee; font: 900 10px/1 var(--body); letter-spacing: .13em; }
.guide-summary-card h3 { margin: 26px 0 9px; font-size: 14px; }
.guide-summary-card p { margin: 0; color: #8e819b; font-size: 11px; line-height: 1.65; word-break: keep-all; }
.notice-box { display: flex; gap: 18px; align-items: flex-start; margin-top: 13px; padding: 19px 22px; border: 1px solid rgba(255,204,113,.17); border-radius: 14px; background: rgba(128,88,28,.07); }.notice-box b { flex: 0 0 auto; color: #ffd58e; font-size: 11px; }.notice-box p { margin: 0; color: #8f8296; font-size: 11px; line-height: 1.6; word-break: keep-all; }

.table-toolbar { align-items: center; }.table-actions { display: flex; align-items: center; gap: 8px; }.direction-switch { display: flex; padding: 4px; border: 1px solid var(--line); border-radius: 11px; background: rgba(0,0,0,.2); }.direction-switch button { min-width: 72px; height: 38px; padding: 0 14px; border: 0; border-radius: 8px; color: #7f728d; background: transparent; cursor: pointer; font-size: 10px; font-weight: 900; }.direction-switch button.active { color: #fff; background: #7e42c5; }.download-button { min-height: 46px; padding: 0 16px; border: 1px solid rgba(185,125,255,.27); border-radius: 11px; color: #dac7ec; background: rgba(136,71,210,.12); cursor: pointer; font-size: 10px; font-weight: 800; }.download-button:hover { background: rgba(136,71,210,.22); }.download-button span { margin-right: 6px; color: #c894ff; }
.data-table-wrap { margin-top: 28px; overflow-x: auto; border: 1px solid var(--line); border-radius: 15px; background: rgba(7,3,13,.28); }.data-table-wrap table { width: 100%; min-width: 720px; border-collapse: collapse; font-variant-numeric: tabular-nums; }.data-table-wrap th, .data-table-wrap td { height: 48px; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,.055); border-right: 1px solid rgba(255,255,255,.045); text-align: right; font-size: 11px; }.data-table-wrap tr:last-child th, .data-table-wrap tr:last-child td { border-bottom: 0; }.data-table-wrap th:last-child, .data-table-wrap td:last-child { border-right: 0; }.data-table-wrap thead th { height: 52px; color: #9c8cab; background: rgba(255,255,255,.035); font-size: 9px; letter-spacing: .04em; }.data-table-wrap thead th:first-child, .data-table-wrap tbody th { text-align: left; }.data-table-wrap tbody th { color: #eee6f7; font-size: 12px; }.data-table-wrap td { color: #9f91ad; }.data-table-wrap .average-column { color: #e0c5ff; background: rgba(147,79,226,.08); font-weight: 900; }
footer { min-height: 96px; display: grid; place-items: center; color: #665a72; font-size: 10px; letter-spacing: .035em; text-align: center; }footer p { margin: 0; }

@media (max-width: 900px) {
  .site-shell { width: min(100% - 24px, 760px); }.hero { padding-top: 56px; }.hero h1 { font-size: clamp(40px, 9vw, 64px); }
  .input-stage { grid-template-columns: 1fr; gap: 30px; padding: 38px 30px; }.average-strip { margin: 28px 26px; }.result-heading { margin-inline: 26px; }.cards-grid { padding-inline: 26px; }
  .guide-summary-grid { grid-template-columns: 1fr; }.guide-summary-card { min-height: 132px; }.guide-summary-card h3 { margin-top: 19px; }.guide-panel, .table-panel { padding: 38px 28px; }.table-toolbar { align-items: flex-start; flex-direction: column; }.table-actions { width: 100%; justify-content: space-between; }
}

@media (max-width: 620px) {
  main { background-size: 42px 42px, 42px 42px, auto, auto; }.aurora { filter: blur(60px); }
  .site-shell { width: min(100% - 14px, 520px); }.site-header { min-height: 76px; padding-inline: 6px; }.ryan-brand { gap: 10px; }.ryan-brand img { width: 46px; height: 46px; border-radius: 15px; }.ryan-brand-copy { align-items: flex-start; flex-direction: column; gap: 5px; }.ryan-brand-copy b { max-width: calc(100vw - 105px); font-size: 14px; overflow: hidden; text-overflow: ellipsis; }.ryan-brand-copy em { padding: 3px 6px; font-size: 8px; }
  .hero { padding: 43px 5px 37px; }.hero h1 { font-size: clamp(36px, 11.5vw, 53px); line-height: 1.1; }.hero > p { max-width: 330px; margin-top: 17px; font-size: 12px; line-height: 1.65; }
  .tabs { position: sticky; top: 7px; z-index: 20; border-radius: 15px; box-shadow: 0 12px 34px rgba(0,0,0,.35); backdrop-filter: blur(20px); }.tabs button { min-height: 54px; gap: 0; }.tabs button small { display: none; }.tabs button span { font-size: 12px; }
  .tab-surface { border-radius: 18px; }.input-stage { gap: 24px; padding: 27px 17px; }.input-copy { gap: 11px; }.section-index { flex-basis: 34px; height: 34px; }.input-copy h2 { font-size: 21px; }.scale-switch button { min-height: 48px; }.grade-input { padding-inline: 15px; }.grade-input-row input { font-size: 30px; }.quick-values { gap: 6px; }.quick-values button { min-width: 48px; height: 40px; }
  .average-strip { grid-template-columns: 42px 1fr; margin: 18px 13px 22px; padding: 16px; }.average-divider { display: none; }.average-verdict { grid-column: 1 / -1; padding-top: 13px; border-top: 1px solid var(--line); }.result-heading { margin: 0 14px 16px; }.cards-grid { grid-template-columns: 1fr; gap: 11px; padding: 0 13px 24px; }.source-card { padding: 18px; border-radius: 16px; }.conversion-readout { margin-block: 22px 18px; }.output-grade { font-size: 28px; }
  .guide-panel, .table-panel { padding: 29px 16px; }.guide-summary-grid { margin-top: 22px; }.guide-summary-card { min-height: 126px; padding: 19px; }.notice-box { display: block; padding: 17px; }.notice-box p { margin-top: 8px; }
  .table-actions { align-items: stretch; flex-direction: column; }.direction-switch button { flex: 1; min-height: 42px; }.download-button { width: 100%; min-height: 48px; }.data-table-wrap { margin-top: 20px; -webkit-overflow-scrolling: touch; }.data-table-wrap th:first-child { position: sticky; left: 0; z-index: 2; background: #160d27; box-shadow: 1px 0 rgba(255,255,255,.06); }
  footer { min-height: 88px; font-size: 9px; }
}

@media (max-width: 380px) {
  .ryan-brand-copy b { font-size: 13px; }.hero h1 { font-size: 35px; }.source-heading h3 { font-size: 12px; }.conversion-readout { grid-template-columns: 1fr 24px 1.15fr; }.input-grade { font-size: 17px; }.output-grade { font-size: 25px; }
}

@media (hover: none) {
  .source-card:hover { transform: none; }.tabs button, .scale-switch button, .quick-values button, .download-button { -webkit-tap-highlight-color: transparent; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
}

/* ver.02: PC / mobile split, restored guide, and focused navigation */
.site-header { justify-content: space-between; gap: 24px; }
.admission-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 44px;
  padding: 0 17px;
  border: 1px solid rgba(198, 146, 255, .34);
  border-radius: 13px;
  color: #f7edff;
  background: linear-gradient(135deg, rgba(153, 79, 237, .22), rgba(82, 36, 145, .16));
  box-shadow: inset 0 1px rgba(255,255,255,.06), 0 10px 28px rgba(59, 19, 105, .2);
  font-size: 12px;
  font-weight: 900;
  text-decoration: none;
  transition: transform .2s ease, border-color .2s ease, background .2s ease;
}
.admission-link b { color: #c99aff; font-size: 16px; }
.admission-link:hover { transform: translateY(-1px); border-color: rgba(211, 171, 255, .62); background: linear-gradient(135deg, rgba(168, 94, 250, .32), rgba(96, 44, 164, .23)); }

.pc-guidance {
  display: grid;
  gap: 7px;
  margin: 18px 0 0;
  padding: 16px 20px;
  border: 1px solid rgba(196, 145, 255, .25);
  border-radius: 14px;
  background: linear-gradient(100deg, rgba(81, 35, 137, .28), rgba(27, 13, 48, .76));
  box-shadow: inset 0 1px rgba(255,255,255,.045), 0 14px 36px rgba(0,0,0,.18);
  color: #e9dcf5;
  font-size: 11px;
  line-height: 1.65;
  word-break: keep-all;
}
.pc-guidance strong { font-weight: 800; }
.pc-guidance a { color: #d4a9ff; text-underline-offset: 3px; }
.mobile-version-link { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: fit-content; min-height: 38px; margin-top: 4px; padding: 0 15px; border: 1px solid rgba(207, 164, 255, .34); border-radius: 10px; background: rgba(161, 91, 239, .13); color: #ead7ff !important; font-size: 11px; font-weight: 900; text-decoration: none; }
.mobile-version-link:hover { border-color: rgba(218, 185, 255, .62); background: rgba(171, 103, 246, .23); }

.guide-hero > p { margin: 0; color: #8e819b; font-size: 11px; line-height: 1.6; word-break: keep-all; }
.steps-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 28px; }
.step-card { min-height: 174px; padding: 22px; border: 1px solid var(--line); border-radius: 16px; background: rgba(255,255,255,.022); }
.step-card > span { color: #b97cfb; font: 900 10px/1 var(--body); letter-spacing: .13em; }
.step-card h3 { margin: 29px 0 10px; font-size: 14px; }
.step-card p { margin: 0; color: #8e819b; font-size: 11px; line-height: 1.65; word-break: keep-all; }
.method-grid { display: grid; gap: 14px; margin-top: 13px; }
.method-card { position: relative; overflow: hidden; padding: 27px 26px; border: 1px solid var(--line); border-radius: 17px; background: rgba(255,255,255,.018); }
.method-card--purple { border-color: rgba(181, 120, 255, .3); background: linear-gradient(135deg, rgba(87, 35, 142, .3), rgba(39, 16, 68, .26)); }
.method-card h3 { margin: 0; font-family: var(--display); font-size: 17px; letter-spacing: -.025em; }
.method-card > p { max-width: 880px; margin: 25px 0 0; color: #9587a3; font-size: 11px; line-height: 1.8; word-break: keep-all; }
.method-card ul { display: grid; gap: 13px; margin: 26px 0 0; padding: 0; list-style: none; }
.method-card li { position: relative; padding-left: 18px; color: #9d8eaa; font-size: 11px; line-height: 1.6; word-break: keep-all; }
.method-card li::before { content: ""; position: absolute; top: .55em; left: 0; width: 6px; height: 6px; border-radius: 50%; background: #b36cff; box-shadow: 0 0 12px #a85cff; }
.method-symbol { position: absolute; top: 18px; right: 24px; color: rgba(196, 146, 255, .13); font: 900 54px/1 var(--display); }
.formula-box { margin-top: 20px; padding: 15px 18px; border: 1px solid rgba(188, 130, 255, .25); border-radius: 11px; color: #e4cff7; background: rgba(119, 55, 183, .13); font-size: 11px; font-weight: 900; text-align: center; }

.app-mode-pc {
  background:
    radial-gradient(ellipse at 50% -12%, rgba(126, 133, 211, .28), transparent 44%),
    radial-gradient(ellipse at 12% 58%, rgba(98, 57, 165, .26), transparent 38%),
    radial-gradient(ellipse at 92% 82%, rgba(74, 93, 173, .2), transparent 35%),
    linear-gradient(160deg, #10051f 0%, #0a0719 44%, #140925 100%);
}
.app-mode-pc::before {
  content: "";
  position: fixed;
  inset: -22%;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 24% 10% at 16% 28%, rgba(114, 171, 236, .3), transparent 76%),
    radial-gradient(ellipse 31% 13% at 43% 20%, rgba(153, 112, 224, .25), transparent 78%),
    radial-gradient(ellipse 25% 11% at 74% 34%, rgba(93, 151, 224, .25), transparent 76%),
    radial-gradient(ellipse 34% 15% at 82% 68%, rgba(145, 87, 209, .2), transparent 79%),
    radial-gradient(ellipse 28% 12% at 28% 76%, rgba(80, 129, 202, .2), transparent 78%);
  filter: blur(34px) saturate(1.28);
  mix-blend-mode: screen;
  opacity: .06;
  transform: translate3d(-5%, -2%, 0) scale(1.02);
  animation: aurora-cloud-visit 31s ease-in-out infinite;
  will-change: transform, opacity;
}
.rain-layer { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; mix-blend-mode: screen; }
.rain-layer::before { content: ""; position: absolute; inset: -15%; background: radial-gradient(ellipse at 18% 26%, rgba(125, 154, 217, .17), transparent 31%), radial-gradient(ellipse at 76% 18%, rgba(142, 104, 205, .14), transparent 32%), radial-gradient(ellipse at 58% 78%, rgba(78, 113, 189, .13), transparent 38%); filter: blur(38px); opacity: .72; animation: dream-mist 22s ease-in-out infinite alternate; }
.rain-layer::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(157, 180, 224, .06), transparent 31%, rgba(94, 60, 157, .045) 76%, rgba(8, 3, 17, .15)); }
.rain-layer i { position: absolute; inset: -34vh -14vw; background-image: repeating-linear-gradient(76deg, transparent 0 82px, rgba(224, 235, 255, .5) 83px 84px, transparent 85px 168px); background-size: 168px 100%; -webkit-mask-image: repeating-linear-gradient(180deg, transparent 0 54px, #000 82px 226px, transparent 256px 370px); mask-image: repeating-linear-gradient(180deg, transparent 0 54px, #000 82px 226px, transparent 256px 370px); -webkit-mask-size: 100% 370px; mask-size: 100% 370px; opacity: .22; filter: blur(.18px); animation: purple-rain 3.9s linear infinite; will-change: background-position, -webkit-mask-position, mask-position; }
.rain-layer i:nth-child(2) { background-image: repeating-linear-gradient(78deg, transparent 0 126px, rgba(187, 205, 244, .4) 127px 128px, transparent 129px 254px); background-size: 254px 100%; -webkit-mask-size: 100% 520px; mask-size: 100% 520px; opacity: .12; filter: blur(.5px); animation-duration: 5.7s; animation-delay: -2.8s; }
.rain-layer i:nth-child(3) { background-image: repeating-linear-gradient(74deg, transparent 0 198px, rgba(226, 213, 255, .32) 199px 200px, transparent 201px 398px); background-size: 398px 100%; -webkit-mask-size: 100% 690px; mask-size: 100% 690px; opacity: .07; filter: blur(.9px); animation-duration: 8.4s; animation-delay: -5.1s; }
@keyframes purple-rain {
  from { background-position: 0 -120px; -webkit-mask-position: 0 -430px; mask-position: 0 -430px; }
  to { background-position: -62px 760px; -webkit-mask-position: 0 430px; mask-position: 0 430px; }
}
@keyframes dream-mist {
  from { transform: translate3d(-2%, -1%, 0) scale(1); opacity: .58; }
  to { transform: translate3d(3%, 2%, 0) scale(1.08); opacity: .82; }
}
@keyframes aurora-cloud-visit {
  0%, 12% { opacity: .04; transform: translate3d(-6%, -2%, 0) scale(1.01); }
  24% { opacity: .55; transform: translate3d(-2%, 1%, 0) scale(1.08); }
  39%, 51% { opacity: .1; transform: translate3d(2%, 0, 0) scale(1.03); }
  64% { opacity: .44; transform: translate3d(5%, 3%, 0) scale(1.11); }
  78%, 88% { opacity: .07; transform: translate3d(1%, -1%, 0) scale(1.04); }
  96% { opacity: .34; transform: translate3d(-3%, 2%, 0) scale(1.08); }
  100% { opacity: .04; transform: translate3d(-6%, -2%, 0) scale(1.01); }
}

/* The mobile artifact keeps a phone-width composition even on a wide display. */
.app-mode-mobile { background: radial-gradient(circle at 50% -8%, rgba(121, 51, 217, .3), transparent 37%), var(--bg); }
.app-mode-mobile .site-shell { width: min(calc(100% - 14px), 520px); }
.app-mode-mobile .site-header { min-height: 0; padding: 14px 6px 16px; flex-wrap: wrap; }
.app-mode-mobile .ryan-brand { gap: 10px; }
.app-mode-mobile .ryan-brand img { width: 46px; height: 46px; border-radius: 15px; }
.app-mode-mobile .ryan-brand-copy { align-items: flex-start; flex-direction: column; gap: 5px; }
.app-mode-mobile .ryan-brand-copy b { max-width: calc(100vw - 105px); font-size: 14px; overflow: hidden; text-overflow: ellipsis; }
.app-mode-mobile .ryan-brand-copy em { padding: 3px 6px; font-size: 8px; }
.app-mode-mobile .admission-link { width: 100%; min-height: 44px; }
.app-mode-mobile .mobile-guidance { margin-top: 14px; padding: 15px 16px; }
.app-mode-mobile .mobile-version-link { width: 100%; min-height: 42px; }
.app-mode-mobile .hero { padding: 43px 5px 37px; }
.app-mode-mobile .hero h1 { font-size: clamp(36px, 11.5vw, 53px); line-height: 1.1; }
.app-mode-mobile .hero > p { max-width: 330px; margin-top: 17px; font-size: 12px; line-height: 1.65; }
.app-mode-mobile .tabs { position: sticky; top: 7px; z-index: 20; border-radius: 15px; box-shadow: 0 12px 34px rgba(0,0,0,.35); backdrop-filter: blur(20px); }
.app-mode-mobile .tabs button { min-height: 54px; gap: 0; }
.app-mode-mobile .tabs button small { display: none; }
.app-mode-mobile .tabs button span { font-size: 12px; }
.app-mode-mobile .tab-surface { border-radius: 18px; }
.app-mode-mobile .input-stage { grid-template-columns: 1fr; gap: 24px; padding: 27px 17px; }
.app-mode-mobile .input-copy { gap: 11px; }
.app-mode-mobile .section-index { flex-basis: 34px; height: 34px; }
.app-mode-mobile .input-copy h2 { font-size: 21px; }
.app-mode-mobile .scale-switch button { min-height: 48px; }
.app-mode-mobile .grade-input { padding-inline: 15px; }
.app-mode-mobile .grade-input-row input { font-size: 30px; }
.app-mode-mobile .quick-values { gap: 6px; }
.app-mode-mobile .quick-values button { min-width: 48px; height: 40px; }
.app-mode-mobile .average-strip { grid-template-columns: 42px 1fr; margin: 18px 13px 22px; padding: 16px; }
.app-mode-mobile .average-divider { display: none; }
.app-mode-mobile .average-verdict { grid-column: 1 / -1; padding-top: 13px; border-top: 1px solid var(--line); }
.app-mode-mobile .result-heading { margin: 0 14px 16px; }
.app-mode-mobile .cards-grid { grid-template-columns: 1fr; gap: 11px; padding: 0 13px 24px; }
.app-mode-mobile .source-card { padding: 18px; border-radius: 16px; }
.app-mode-mobile .conversion-readout { margin-block: 22px 18px; }
.app-mode-mobile .output-grade { font-size: 28px; }
.app-mode-mobile .guide-panel, .app-mode-mobile .table-panel { padding: 29px 16px; }
.app-mode-mobile .guide-hero { align-items: flex-start; flex-direction: column; gap: 12px; }
.app-mode-mobile .steps-grid { grid-template-columns: 1fr; margin-top: 22px; }
.app-mode-mobile .step-card { min-height: 126px; padding: 19px; }
.app-mode-mobile .step-card h3 { margin-top: 19px; }
.app-mode-mobile .method-card { padding: 23px 19px; }
.app-mode-mobile .method-symbol { right: 16px; font-size: 44px; }
.app-mode-mobile .notice-box { display: block; padding: 17px; }
.app-mode-mobile .notice-box p { margin-top: 8px; }
.app-mode-mobile .table-toolbar { align-items: flex-start; flex-direction: column; }
.app-mode-mobile .table-actions { width: 100%; align-items: stretch; flex-direction: column; }
.app-mode-mobile .direction-switch button { flex: 1; min-height: 42px; }
.app-mode-mobile .download-button { width: 100%; min-height: 48px; }
.app-mode-mobile .data-table-wrap { margin-top: 20px; -webkit-overflow-scrolling: touch; }
.app-mode-mobile .data-table-wrap th:first-child { position: sticky; left: 0; z-index: 2; background: #160d27; box-shadow: 1px 0 rgba(255,255,255,.06); }

@media (max-width: 620px) {
  .site-header { flex-wrap: wrap; padding-block: 12px; }
  .admission-link { width: 100%; }
  .guide-hero { align-items: flex-start; flex-direction: column; gap: 12px; }
  .steps-grid { grid-template-columns: 1fr; }
  .step-card { min-height: 126px; padding: 19px; }
  .step-card h3 { margin-top: 19px; }
  .method-card { padding: 23px 19px; }
  .pc-guidance { padding: 15px 16px; }
}

/* ver.07: a calmer shared dreamscape for both artifacts */
.app-mode::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-image:
    radial-gradient(circle, rgba(235, 224, 255, .58) 0 1px, transparent 1.8px),
    radial-gradient(circle, rgba(166, 202, 255, .38) 0 1px, transparent 1.7px),
    radial-gradient(circle, rgba(222, 176, 255, .32) 0 .8px, transparent 1.6px);
  background-position: 18px 24px, 91px 137px, 43px 76px;
  background-size: 183px 211px, 269px 307px, 137px 173px;
  -webkit-mask-image: linear-gradient(180deg, #000, rgba(0,0,0,.42) 38%, transparent 92%);
  mask-image: linear-gradient(180deg, #000, rgba(0,0,0,.42) 38%, transparent 92%);
  opacity: .19;
  animation: dream-stars 38s linear infinite;
}
.app-mode-pc::after {
  background-image:
    radial-gradient(circle, rgba(255, 255, 255, 1) 0 1.45px, rgba(220, 197, 255, .74) 1.6px 2.6px, transparent 4.8px),
    radial-gradient(circle, rgba(198, 226, 255, .98) 0 1.2px, rgba(132, 185, 255, .58) 1.5px 2.5px, transparent 4.6px),
    radial-gradient(circle, rgba(247, 212, 255, .92) 0 1px, rgba(208, 142, 255, .55) 1.35px 2.2px, transparent 4.2px),
    radial-gradient(circle, rgba(255, 255, 255, .9) 0 .85px, transparent 2.8px);
  background-position: 17px 21px, 84px 129px, 39px 72px, 121px 44px;
  background-size: 137px 157px, 211px 239px, 101px 127px, 173px 193px;
  -webkit-mask-image: linear-gradient(180deg, #000 0 52%, rgba(0,0,0,.78) 72%, transparent 100%);
  mask-image: linear-gradient(180deg, #000 0 52%, rgba(0,0,0,.78) 72%, transparent 100%);
  mix-blend-mode: screen;
  opacity: .72;
  filter: drop-shadow(0 0 5px rgba(205, 170, 255, .88)) drop-shadow(0 0 11px rgba(112, 164, 255, .42));
  animation: pc-starlight 11s ease-in-out infinite;
}
.app-mode-mobile::before {
  content: "";
  position: fixed;
  inset: -24%;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 35% 14% at 16% 22%, rgba(109, 159, 232, .28), transparent 78%),
    radial-gradient(ellipse 42% 18% at 76% 34%, rgba(166, 95, 226, .25), transparent 79%),
    radial-gradient(ellipse 36% 15% at 38% 72%, rgba(93, 115, 216, .22), transparent 80%);
  filter: blur(36px) saturate(1.32);
  mix-blend-mode: screen;
  opacity: .38;
  animation: mobile-aurora 27s ease-in-out infinite alternate;
  will-change: transform, opacity;
}
.app-mode-mobile {
  background:
    radial-gradient(circle at 52% -8%, rgba(135, 87, 222, .42), transparent 38%),
    radial-gradient(circle at 8% 52%, rgba(76, 104, 190, .2), transparent 34%),
    radial-gradient(circle at 96% 76%, rgba(155, 67, 190, .18), transparent 36%),
    linear-gradient(165deg, #0d0619, #080511 52%, #120820);
}
.app-mode .aurora { animation: dream-orbit 19s ease-in-out infinite alternate; }
.app-mode .aurora-two { animation-duration: 25s; animation-delay: -9s; }
.app-mode .hero h1 span { background-size: 190% auto; animation: dream-title 10s ease-in-out infinite alternate; }
.app-mode .tabs { border-color: rgba(220, 190, 255, .18); box-shadow: inset 0 1px rgba(255,255,255,.035), 0 18px 46px rgba(12, 3, 25, .25); }
.app-mode .tab-surface { border-color: rgba(218, 187, 255, .17); background: linear-gradient(180deg, rgba(25, 13, 44, .78), rgba(10, 7, 22, .88)); box-shadow: inset 0 1px rgba(255,255,255,.035), 0 34px 110px rgba(5, 1, 13, .42), 0 0 70px rgba(120, 60, 189, .08); }
.app-mode .source-card { box-shadow: inset 0 1px rgba(255,255,255,.025), 0 16px 46px rgba(0,0,0,.2), 0 0 38px color-mix(in srgb, var(--accent) 5%, transparent); }
.app-mode .grade-input { box-shadow: inset 0 0 32px rgba(177, 109, 255, .025), 0 0 30px rgba(106, 54, 170, .035); }

@keyframes dream-stars {
  from { background-position: 18px 24px, 91px 137px, 43px 76px; opacity: .12; }
  50% { opacity: .24; }
  to { background-position: 67px 92px, 38px 219px, 96px 141px; opacity: .16; }
}
@keyframes pc-starlight {
  0% { background-position: 17px 21px, 84px 129px, 39px 72px, 121px 44px; opacity: .45; filter: brightness(.9) drop-shadow(0 0 4px rgba(205, 170, 255, .7)); }
  18% { opacity: .92; filter: brightness(1.35) drop-shadow(0 0 7px rgba(226, 203, 255, 1)) drop-shadow(0 0 14px rgba(109, 166, 255, .62)); }
  36% { opacity: .58; filter: brightness(1.02) drop-shadow(0 0 5px rgba(205, 170, 255, .8)); }
  57% { opacity: 1; filter: brightness(1.5) drop-shadow(0 0 8px rgba(240, 220, 255, 1)) drop-shadow(0 0 17px rgba(118, 174, 255, .72)); }
  76% { opacity: .54; filter: brightness(.98) drop-shadow(0 0 5px rgba(205, 170, 255, .78)); }
  100% { background-position: 52px 79px, 35px 196px, 92px 129px, 64px 103px; opacity: .84; filter: brightness(1.24) drop-shadow(0 0 7px rgba(226, 203, 255, .96)); }
}
@keyframes mobile-aurora {
  from { transform: translate3d(-4%, -2%, 0) scale(1.01); opacity: .25; }
  to { transform: translate3d(5%, 3%, 0) scale(1.1); opacity: .52; }
}
@keyframes dream-orbit {
  from { transform: translate3d(-2%, -2%, 0) scale(.96); opacity: .23; }
  to { transform: translate3d(5%, 4%, 0) scale(1.08); opacity: .38; }
}
@keyframes dream-title {
  from { background-position: 0% 50%; filter: saturate(.92); }
  to { background-position: 100% 50%; filter: saturate(1.18); }
}
